name: TF2 Fighter PS3 Build

on:
workflow_dispatch:
push:
branches: [ main, master ]

jobs:
build:
runs-on: ubuntu-22.04
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y build-essential git make python3 python3-pip
      
  - name: Clone PSL1GHT
    run: |
      git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git "$GITHUB_WORKSPACE/PSL1GHT"

  - name: Check toolchain
    run: |
      echo "Checking PS3 compiler..."
      if ! command -v ppu-gcc >/dev/null 2>&1; then
        echo "PS3 compiler is not installed."
        echo "A complete PS3 toolchain is required."
        exit 1
      fi
      ppu-gcc --version

  - name: Build application
    run: |
      make

  - name: Upload build output
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: tf2-fighter-build
      path: |
        *.pkg
        *.elf
        *.self
      if-no-files-found: warn
