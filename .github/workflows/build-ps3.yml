name: TF2 Fighter PS3 Build
'on': [push, workflow_dispatch]
jobs: {build: {runs-on: ubuntu-22.04, steps: [{name: Checkout, uses: actions/checkout@v4}, {name: Install dependencies, run: 'sudo apt-get update && sudo apt-get install -y build-essential git make python3'}, {name: Check PS3 compiler, run: 'if command -v ppu-gcc >/dev/null 2>&1; then ppu-gcc --version; else echo "PS3 compiler missing"; exit 1; fi'}]}}
