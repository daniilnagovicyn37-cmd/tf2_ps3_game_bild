name: TF2 Fighter PS3 Build

on:
workflow_dispatch:
push:
branches: [main, master]

jobs:
build:
runs-on: ubuntu-22.04
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y build-essential git make python3

  - name: Check PS3 toolchain
    run: |
      if command -v ppu-gcc >/dev/null 2>&1; then
        ppu-gcc --version
      else
        echo "PS3 compiler is missing."
        exit 1
      fi

  - name: Build application
    run: make

  - name: Upload build output
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: tf2-fighter-build
      path: |
        *.pkg
        *.elf
        *.self
      if-no-files-found: warn
