name: TF2 Fighter PS3 Build
'on': [push, workflow_dispatch]
jobs: {build: {runs-on: ubuntu-22.04, steps: [{name: Checkout, uses: actions/checkout@v4}, {name: Show environment, run: 'echo "PS3DEV=$PS3DEV"; echo "PSL1GHT=$PSL1GHT"; command -v ppu-gcc || true; command -v make_self_npdrm || true; command -v pkg || true; find /usr /opt -name ppu_rules -o -name ppu-gcc 2>/dev/null | head -30; true'}]}}
