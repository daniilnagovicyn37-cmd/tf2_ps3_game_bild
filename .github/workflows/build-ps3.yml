name: TF2 Fighter PS3 Build
'on': [push, workflow_dispatch]
jobs: {build: {runs-on: ubuntu-22.04, steps: [{name: Checkout, uses: actions/checkout@v4}, {name: Install dependencies, run: 'sudo apt-get update && sudo apt-get install -y build-essential git make python3'}, {name: Install PS3 toolchain, run: 'git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain && cd /tmp/ps3toolchain && ls -la'}, {name: Report status, run: 'echo "Toolchain source downloaded; compiler is not yet built"'}]}}
