name: TF2 Fighter PS3 Build
'on': [push, workflow_dispatch]
jobs: {"build":{"runs-on":"ubuntu-22.04","timeout-minutes":45,"steps":[{"name":"Checkout project","uses":"actions/checkout@v5"},{"name":"Download verified PS3DEV SDK","shell":"bash","run":"set -euo pipefail; curl -fL 'https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz' -o /tmp/ps3dev.tar.gz; echo 'dcbed747e094c6a382dae5b0aacc322a1d4390d9f2849a7d750a96ea398ee8ab  /tmp/ps3dev.tar.gz' | sha256sum -c -; sudo mkdir -p /usr/local/ps3dev; sudo tar -xzf /tmp/ps3dev.tar.gz -C /usr/local/ps3dev; echo 'PS3DEV=/usr/local/ps3dev' >> \"$GITHUB_ENV\"; echo 'PSL1GHT=/usr/local/ps3dev' >> \"$GITHUB_ENV\"; echo '/usr/local/ps3dev/bin' >> \"$GITHUB_PATH\"; echo '/usr/local/ps3dev/ppu/bin' >> \"$GITHUB_PATH\"; echo '/usr/local/ps3dev/spu/bin' >> \"$GITHUB_PATH\""},{"name":"Verify PS3 compiler and package tools","shell":"bash","run":"set -euo pipefail; command -v ppu-gcc; ppu-gcc --version; command -v make_self_npdrm; command -v pkg; test -f \"$PSL1GHT/ppu_rules\"; test -f \"$PS3DEV/bin/sfo.xml\"; test -f \"$PS3DEV/bin/ICON0.PNG\""},{"name":"Get PSL1GHT graphics sample","shell":"bash","run":"set -euo pipefail; git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git psl1ght-source; mkdir -p work; cp -R psl1ght-source/samples/graphics/videoTest work/videoTest; sed -i -e 's|^TITLE[[:space:]]*:*=.*|TITLE := TF2 Fighter - PS3 Test|' -e 's|^APPID[[:space:]]*:*=.*|APPID := TFB000001|' -e 's|^LIBS[[:space:]]*:=.*|LIBS := -lgcm_sys -lrsx -lsysutil -lio -lm -lrt -llv2|' work/videoTest/Makefile; grep -E '^(TITLE|APPID|LIBS)[[:space:]]*:?=' work/videoTest/Makefile"},{"name":"Build ELF, SELF, and PKG","shell":"bash","run":"set -euo pipefail; cd work/videoTest; make videoTest.pkg; test -s videoTest.elf; test -s videoTest.self; test -s videoTest.pkg; file videoTest.elf videoTest.self videoTest.pkg; ls -lh videoTest.elf videoTest.self videoTest.pkg"},{"name":"Upload build results","uses":"actions/upload-artifact@v4","with":{"name":"tf2-fighter-ps3-test-build","path":"work/videoTest/videoTest.*","if-no-files-found":"error"}}]}}
